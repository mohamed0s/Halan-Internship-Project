services:
  db:
    image: postgres:15-alpine
    container_name: halan-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - halan_pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - halan-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  webapp:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: halan-web
    restart: always
    environment:
      PORT: 5000
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_PORT: ${DB_PORT}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - halan-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: halan-frontend
    restart: always
    ports:
      - "4000:80"
    depends_on:
      - webapp
    networks:
      - halan-net

volumes:
  halan_pg_data:
    driver: local

networks:
  halan-net:
    driver: bridge
