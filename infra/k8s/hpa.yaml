apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: halan-backend-hpa
  namespace: halan
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: halan-backend          
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50  # Percentage of the CPU request
