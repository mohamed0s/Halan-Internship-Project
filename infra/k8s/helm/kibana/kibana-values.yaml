# infra/k8s/helm/kibana/kibana-values.yaml
# Official Elastic chart — kibana 8.5.1

elasticsearchHosts: "https://elasticsearch-master:9200"

kibanaConfig:
  kibana.yml: |
    elasticsearch.ssl.verificationMode: none
    server.name: halan-kibana

service:
  type: ClusterIP
  port: 5601

resources:
  requests:
    cpu: 10m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

extraEnvs:
  - name: "ELASTIC_PASSWORD"
    valueFrom:
      secretKeyRef:
        name: elasticsearch-master-credentials
        key: password

lifecycle:
  postStart:
    exec:
      command:
        - bash
        - -c
        - |
          #!/bin/bash
          (
            until curl -s -u "elastic:${ELASTIC_PASSWORD}" "http://localhost:5601/api/status" | grep -q "available"; do
              sleep 5
            done
            curl -s -u "elastic:${ELASTIC_PASSWORD}" -X POST "http://localhost:5601/api/saved_objects/index-pattern/fluent-bit" -H "kbn-xsrf: true" -H "Content-Type: application/json" -d '{"attributes": {"title": "fluent-bit-*", "timeFieldName": "@timestamp"}}'
            curl -s -u "elastic:${ELASTIC_PASSWORD}" -X POST "http://localhost:5601/api/data_views/data_view" -H "kbn-xsrf: true" -H "Content-Type: application/json" -d '{"data_view": {"title": "fluent-bit-*", "name": "Fluent Bit Logs", "timeFieldName": "@timestamp"}}'
          ) &
