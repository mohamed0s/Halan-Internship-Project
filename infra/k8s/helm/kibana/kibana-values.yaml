# infra/k8s/helm/kibana/kibana-values.yaml
# Official Elastic chart — kibana 8.5.1
#
# AUTH STRATEGY: We authenticate Kibana to Elasticsearch using the built-in
# `elastic` superuser credentials injected from the elasticsearch-master-credentials
# secret. This avoids reliance on the pre-install hook's service account token
# mechanism (kibana-kibana-es-token), which is fragile on repeated ArgoCD syncs.

elasticsearchHosts: "https://elasticsearch-master:9200"

kibanaConfig:
  kibana.yml: |
    elasticsearch.ssl.verificationMode: none
    elasticsearch.username: elastic
    elasticsearch.password: ${ELASTIC_PASSWORD}
    server.name: halan-kibana

service:
  type: ClusterIP
  port: 5601

resources:
  requests:
    cpu: 10m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Inject the elastic password from the secret so kibana.yml can reference it
extraEnvs:
  - name: "ELASTIC_PASSWORD"
    valueFrom:
      secretKeyRef:
        name: elasticsearch-master-credentials
        key: password
