# infra/k8s/helm/kibana/kibana-values.yaml
# Official Elastic chart — kibana 8.5.1
#
# AUTH STRATEGY: We authenticate Kibana to Elasticsearch using the built-in
# Elasticsearch service account token mechanism.
#
# HOW IT WORKS:
#   1. The Elastic Helm chart ships a pre-install hook (kibana-setup Job) that
#      calls the ES /_security/service/elastic/kibana/credential/token API to
#      mint a service-scoped token for Kibana.
#   2. That token is stored in the `kibana-kibana-es-token` Secret (namespace: logging).
#   3. The chart mounts that secret as the ELASTICSEARCH_SERVICEACCOUNTTOKEN env
#      var inside the Kibana container — no username/password is used.
#
# WHY NOT elastic/password:
#   Kibana 8.x explicitly REJECTS elasticsearch.username = "elastic" in kibana.yml.
#   The elastic user is a superuser; Kibana needs to write to .kibana system indices
#   with a service-account-scoped credential, not a cluster superuser.
#   Attempting it causes a FATAL crash at startup (config validation failure).

elasticsearchHosts: "https://elasticsearch-master:9200"

kibanaConfig:
  kibana.yml: |
    # TLS: ES uses a self-signed cert; skip hostname verification inside the cluster.
    elasticsearch.ssl.verificationMode: none
    server.name: halan-kibana

service:
  type: ClusterIP
  port: 5601

resources:
  requests:
    cpu: 10m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
