# infra/k8s/helm/kibana/kibana-values.yaml
# Official Elastic chart — kibana 8.5.1

elasticsearchHosts: "http://elasticsearch-master:9200"

kibanaConfig:
  kibana.yml: |
    elasticsearch.ssl.verificationMode: none
    xpack.security.enabled: false
    server.name: halan-kibana

service:
  type: ClusterIP
  port: 5601

resources:
  requests:
    cpu: 10m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
