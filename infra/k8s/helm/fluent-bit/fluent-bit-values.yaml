# infra/k8s/helm/fluent-bit/fluent-bit-values.yaml
# --------------------------------------------------
# Bitnami Fluent Bit chart
# Runs as a DaemonSet — one pod per node
# --------------------------------------------------
# PIPELINE: INPUT → FILTER → OUTPUT
#
#   INPUT:  Read container logs from /var/log/containers/*.log (all namespaces)
#   FILTER: Enrich each log line with K8s metadata
#           (pod name, namespace, labels, container name)
#   OUTPUT: Forward to Elasticsearch in the logging namespace
#
# WHY Fluent Bit over Filebeat?
#   - CNCF-graduated project (Filebeat is Elastic-proprietary)
#   - ~450KB binary vs ~30MB for Filebeat → much lower resource footprint
#   - Native Kubernetes metadata enrichment built-in
#   - Bitnami maintains an official, hardened chart
# --------------------------------------------------

kind: DaemonSet

env:
  - name: ELASTIC_PASSWORD
    valueFrom:
      secretKeyRef:
        name: elasticsearch-master-credentials
        key: password

config:
  inputs: |
    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        multiline.parser  docker, cri
        Tag               kube.*
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On

  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On

  outputs: |
    [OUTPUT]
        Name            es
        Match           *
        Host            elasticsearch-master.logging.svc.cluster.local
        Port            9200
        tls             On
        tls.verify      Off
        HTTP_User       elastic
        HTTP_Passwd     ${ELASTIC_PASSWORD}
        Logstash_Format On
        Logstash_Prefix fluent-bit
        Retry_Limit     False

# --- RBAC: Fluent Bit needs to call the K8s API for metadata enrichment ---
rbac:
  create: true # Creates ClusterRole with get/list/watch on pods/namespaces

serviceAccount:
  create: true

# --- Resource limits: Fluent Bit is extremely lightweight ---
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi


initContainers:
  - name: sysctl
    image: busybox:1.36.1
    command: ["sh", "-c", "sysctl -w fs.inotify.max_user_instances=81920"]
    securityContext:
      privileged: true
