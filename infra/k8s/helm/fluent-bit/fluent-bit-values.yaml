# infra/k8s/helm/fluent-bit/fluent-bit-values.yaml
# --------------------------------------------------
# Bitnami Fluent Bit chart
# Runs as a DaemonSet — one pod per node
# --------------------------------------------------
# PIPELINE: INPUT → FILTER → OUTPUT
#
#   INPUT:  Read container logs from /var/log/containers/*.log (all namespaces)
#   FILTER: Enrich each log line with K8s metadata
#           (pod name, namespace, labels, container name)
#   OUTPUT: Forward to Elasticsearch in the logging namespace
#
# WHY Fluent Bit over Filebeat?
#   - CNCF-graduated project (Filebeat is Elastic-proprietary)
#   - ~450KB binary vs ~30MB for Filebeat → much lower resource footprint
#   - Native Kubernetes metadata enrichment built-in
#   - Bitnami maintains an official, hardened chart
# --------------------------------------------------

daemonset:
  enabled: true

config:
  inputs: |
    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        multiline.parser  docker, cri
        Tag               kube.*
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On

  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On

  outputs: |
    [OUTPUT]
        Name            es
        Match           *
        Host            elasticsearch-master-hl.logging.svc.cluster.local
        Port            9200
        Logstash_Format On          # WHY? Creates daily indices like fluent-bit-2024.01.15
        Logstash_Prefix fluent-bit  # Index prefix — you'll create a fluent-bit-* pattern in Kibana
        Retry_Limit     False       # Keep retrying on ES downtime (never drop logs)
        tls             Off         # TODO (prod): enable TLS when ES security is on

# --- RBAC: Fluent Bit needs to call the K8s API for metadata enrichment ---
rbac:
  create: true # Creates ClusterRole with get/list/watch on pods/namespaces

serviceAccount:
  create: true

# --- Resource limits: Fluent Bit is extremely lightweight ---
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

