apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kibana
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    # Source 1: Bitnami Kibana chart
    - repoURL: https://charts.bitnami.com/bitnami
      chart: kibana
      targetRevision: "12.1.10"
      helm:
        valueFiles:
          - $values/infra/k8s/helm/kibana/kibana-values.yaml

    # Source 2: Git repo for values reference
    - repoURL: https://github.com/mohamed0s/Halan-Internship-Project
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: logging # Same namespace as Elasticsearch
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
