apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kibana
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://helm.elastic.co
      chart: kibana
      targetRevision: "8.5.1" # must match elasticsearch version
      helm:
        valueFiles:
          - $values/infra/k8s/helm/kibana/kibana-values.yaml

    - repoURL: https://github.com/mohamed0s/Halan-Internship-Project
      targetRevision: HEAD
      ref: values

    # Declarative Job that creates the fluent-bit-* Data View in Kibana
    # after every fresh deployment (ArgoCD PostSync hook, wave 6)
    - repoURL: https://github.com/mohamed0s/Halan-Internship-Project
      targetRevision: HEAD
      path: infra/k8s/helm/kibana
      directory:
        include: "kibana-dataview-job.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

