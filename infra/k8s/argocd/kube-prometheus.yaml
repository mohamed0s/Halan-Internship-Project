apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    # Source 1: Bitnami kube-prometheus chart
    - repoURL: https://charts.bitnami.com/bitnami
      chart: kube-prometheus
      targetRevision: "11.3.10"
      helm:
        valueFiles:
          - $values/infra/k8s/helm/kube-prometheus/kube-prometheus-values.yaml

    # Source 2: Git repo for values reference
    - repoURL: https://github.com/mohamed0s/Halan-Internship-Project
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
