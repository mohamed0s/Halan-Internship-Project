apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: halan-nginx
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: nginx
    targetRevision: "25.0.21"
    helm:
      valueFiles:
        - https://raw.githubusercontent.com/mohamed0s/Halan-Internship-Project/HEAD/infra/k8s/helm/nginx/nginx-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: halan
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
