apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: halan-nginx
  namespace: argocd
spec:
  project: default
  sources:
    # Source 1: The actual Bitnami Nginx chart (from Bitnami's Helm repo)
    - repoURL: https://charts.bitnami.com/bitnami
      chart: nginx
      targetRevision: "25.0.21"
      helm:
        # $values is a reference to Source 2 below — ArgoCD resolves it at sync time
        valueFiles:
          - $values/infra/k8s/helm/nginx/nginx-values.yaml

    # Source 2: Your Git repo — used ONLY to load values files, not to apply any YAML
    - repoURL: https://github.com/mohamed0s/Halan-Internship-Project
      targetRevision: HEAD
      ref: values   # This names the source "$values" for the reference above
  destination:
    server: https://kubernetes.default.svc
    namespace: halan
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
