name: Docker Image CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  changes:
    name: Detect File Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Check for file changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/docker-image.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/docker-image.yml'

  build-backend:
    name: Build Backend Image
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata (Backend)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/halan-backend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and load Backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/halan-backend:${{ steps.meta.outputs.version }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Backend Docker image to Docker Hub
        if: github.event_name != 'pull_request'
        run: |
          docker push --all-tags ${{ secrets.DOCKER_USERNAME }}/halan-backend

  build-frontend:
    name: Build Frontend Image
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata (Frontend)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/halan-frontend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and load Frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/halan-frontend:${{ steps.meta.outputs.version }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Frontend Docker image to Docker Hub
        if: github.event_name != 'pull_request'
        run: |
          docker push --all-tags ${{ secrets.DOCKER_USERNAME }}/halan-frontend

  # -----------------------------------------------------------------------
  # CD: Update image tag in Git → ArgoCD detects change → deploys to K8s
  # This is the GitOps "image updater" pattern.
  # GitHub Actions no longer SSHes into anything. It only writes to Git.
  # -----------------------------------------------------------------------
  update-image-tag:
    name: Update Backend Image Tag (GitOps)
    runs-on: ubuntu-latest
    # Only runs after a successful backend build, and only on pushes to main (not PRs)
    needs: [build-backend]
    if: |
      needs.build-backend.result == 'success' &&
      github.event_name != 'pull_request'
    # Grant the GITHUB_TOKEN permission to push commits back to this repo
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Fetch the full history so git can push cleanly
          fetch-depth: 0

      - name: Compute short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Update image tag in Helm values
        run: |
          sed -i 's/tag: .*/tag: "sha-${{ steps.sha.outputs.short }}"/' \
            infra/k8s/helm/backend/values.yaml

      - name: Commit and push updated values.yaml
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/k8s/helm/backend/values.yaml
          git commit -m "ci: update backend image tag to sha-${{ steps.sha.outputs.short }} [skip ci]"
          git push

  update-frontend-image-tag:
    name: Update Frontend Image Tag (GitOps)
    runs-on: ubuntu-latest
    needs: [build-frontend]
    if: |
      needs.build-frontend.result == 'success' &&
      github.event_name != 'pull_request'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Update image tag in Nginx Helm values
        run: |
          sed -i 's/tag: .*/tag: "sha-${{ steps.sha.outputs.short }}"/' \
            infra/k8s/helm/nginx/nginx-values.yaml

      - name: Commit and push updated nginx-values.yaml
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/k8s/helm/nginx/nginx-values.yaml
          git commit -m "ci: update frontend image tag to sha-${{ steps.sha.outputs.short }} [skip ci]"
          git push